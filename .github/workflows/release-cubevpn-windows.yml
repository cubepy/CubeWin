name: Release CubeVPN Desktop for Windows (x64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish to (e.g. v1.0.0). Leave empty to just build, no release.
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch bundled engine (Xray/sing-box)
        shell: pwsh
        run: .\install-engine.ps1

      - name: Configure account API base URL
        shell: bash
        env:
          CUBE_API_BASE_URL: ${{ secrets.CUBE_API_BASE_URL }}
        run: |
          if [ -z "$CUBE_API_BASE_URL" ]; then
            echo "::warning::CUBE_API_BASE_URL secret is not set — sign-in will be disabled in this build."
          fi
          sed -i "s#CUBE_API_BASE_URL = \"\"#CUBE_API_BASE_URL = \"${CUBE_API_BASE_URL}\"#" \
            ./uac_desktop/app_config.py

      # The version the app reports has to come from the tag it is built from.
      # Hand-editing the constant is what let v1.5.2 ship reporting 1.0.6, so
      # every install thought it was out of date and reinstalling never helped.
      - name: Stamp version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.release_tag }}" ]; then
            echo "No release tag supplied — leaving the source version in place for this test build."
            exit 0
          fi
          python tools/stamp_version.py "$RELEASE_TAG"
          python -c "import uac_desktop; print('building version', uac_desktop.__version__)"

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean .\CubeVPN.spec

      - name: Package portable zip
        shell: bash
        run: |
          cd dist
          7z a -tZip ../CubeVPN-windows-x64.zip CubeVPN

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CubeVPN-windows-x64
          path: CubeVPN-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CubeVPN-windows-x64.zip
