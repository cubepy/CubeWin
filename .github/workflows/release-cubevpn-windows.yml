name: Release CubeVPN Desktop for Windows (x64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish to (e.g. v1.0.0). Leave empty to just build, no release.
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch bundled engine (Xray/sing-box)
        shell: pwsh
        run: .\install-engine.ps1

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean .\CubeVPN.spec

      - name: Package portable zip
        shell: bash
        run: |
          cd dist
          7z a -tZip ../CubeVPN-windows-x64.zip CubeVPN

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CubeVPN-windows-x64
          path: CubeVPN-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CubeVPN-windows-x64.zip
